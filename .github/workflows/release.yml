name: Release

# 推送 v* 标签 → 自动构建并发布 GitHub Release。
# workflow_dispatch 只构建、不发版，用于自检。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: Server (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version
        run: echo "VERSION=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_ENV"

      # web/dist 是 go:embed 的输入，必须先于 go build 生成。
      - name: Build frontend
        run: cd web && npm ci && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          exe=""
          [ "$GOOS" = "windows" ] && exe=".exe"
          name="vellum-$VERSION-$GOOS-$GOARCH"
          go build -trimpath -ldflags "-s -w -X github.com/nonex-code/vellum/internal/version.Version=$VERSION" -o "dist/$name$exe" .
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip "../$name.zip" "$name$exe")
          else
            (cd dist && tar czf "../$name.tar.gz" "$name$exe")
          fi
          sha256sum "$name".* >> "checksums-$GOOS-$GOARCH.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            vellum-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.*
            checksums-${{ matrix.os }}-${{ matrix.arch }}.txt
          if-no-files-found: error

  desktop-windows:
    name: Desktop shell (windows-amd64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version
        run: echo "VERSION=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_ENV"
        shell: bash

      - name: Build frontend
        run: cd web && npm ci && npm run build
        shell: bash

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Windows 桌面构建无需 CGO（WebView2 走纯 Go syscall）；
      # 与 `wails build` 一致，这里不设 CGO_ENABLED，继承默认值。
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          bin="vellum-$VERSION-desktop-windows-amd64"
          go build -trimpath -tags "desktop,production" -ldflags "-s -w -H=windowsgui -X github.com/nonex-code/vellum/internal/version.Version=$VERSION" -o "dist/$bin.exe" .
          powershell -Command "Compress-Archive -Path 'dist/$bin.exe' -DestinationPath '$bin.zip'"
          sha256sum "$bin.zip" > checksums-desktop-windows-amd64.txt
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-amd64
          path: |
            vellum-${{ env.VERSION }}-desktop-windows-amd64.zip
            checksums-desktop-windows-amd64.txt
          if-no-files-found: error

  desktop-macos:
    name: Desktop shell (macos-${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version
        run: echo "VERSION=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_ENV"
        shell: bash

      - name: Build frontend
        run: cd web && npm ci && npm run build
        shell: bash

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # macOS 桌面壳走 Cocoa/WebKit，需要 CGO（runner 自带 Xcode 工具链）。
      # Apple Silicon runner 上由 clang 交叉编译 amd64（Apple 工具链支持 -arch）。
      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          bin="vellum-$VERSION-desktop-darwin-$GOARCH"
          go build -trimpath -tags "desktop,production" -ldflags "-s -w -X github.com/nonex-code/vellum/internal/version.Version=$VERSION" -o "dist/$bin" .
          (cd dist && tar czf "../$bin.tar.gz" "$bin")
          sha256sum "$bin.tar.gz" > "checksums-desktop-darwin-$GOARCH.txt"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin-${{ matrix.arch }}
          path: |
            vellum-${{ env.VERSION }}-desktop-darwin-${{ matrix.arch }}.tar.gz
            checksums-desktop-darwin-${{ matrix.arch }}.txt
          if-no-files-found: error

  desktop-linux:
    name: Desktop shell (linux-amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version
        run: echo "VERSION=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Wails Linux 需要 GTK3 + WebKit2GTK；Ubuntu 24.04 提供的是 webkit2gtk-4.1，
      # 对应 Wails 的 webkit2_41 构建标签。
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          bin="vellum-$VERSION-desktop-linux-amd64"
          go build -trimpath -tags "desktop,production,webkit2_41" -ldflags "-s -w -X github.com/nonex-code/vellum/internal/version.Version=$VERSION" -o "dist/$bin" .
          (cd dist && tar czf "../$bin.tar.gz" "$bin")
          sha256sum "$bin.tar.gz" > checksums-desktop-linux-amd64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-amd64
          path: |
            vellum-${{ env.VERSION }}-desktop-linux-amd64.tar.gz
            checksums-desktop-linux-amd64.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [server, desktop-windows, desktop-macos, desktop-linux]
    # 任一构建 job 失败则不发布（needs 的默认语义）；仅 v* 标签发版。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        run: |
          cd artifacts
          cat checksums-*.txt > checksums.txt
          rm checksums-*.txt
          ls -1

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true