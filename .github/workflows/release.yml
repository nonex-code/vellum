name: Release

# 推送 v* 标签 → 自动构建并发布 GitHub Release。
# workflow_dispatch 只构建、不发版，用于自检。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: Server (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version
        run: echo "VERSION=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_ENV"

      # web/dist 是 go:embed 的输入，必须先于 go build 生成。
      - name: Build frontend
        run: cd web && npm ci && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          exe=""
          [ "$GOOS" = "windows" ] && exe=".exe"
          name="vellum-$VERSION-$GOOS-$GOARCH"
          go build -trimpath -ldflags "-s -w -X github.com/nonex-code/vellum/internal/version.Version=$VERSION" -o "dist/$name$exe" .
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip "../$name.zip" "$name$exe")
          else
            (cd dist && tar czf "../$name.tar.gz" "$name$exe")
          fi
          sha256sum "$name".* >> "checksums-$GOOS-$GOARCH.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            vellum-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.*
            checksums-${{ matrix.os }}-${{ matrix.arch }}.txt
          if-no-files-found: error

  desktop:
    name: Desktop shell (windows-amd64)
    runs-on: windows-latest
    timeout-minutes: 45
    # Wails 壳只在 Windows 构建：其他平台需要 GTK/WebKit 原生依赖，交叉编译不成立。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version
        run: echo "VERSION=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_ENV"
        shell: bash

      - name: Build frontend
        run: cd web && npm ci && npm run build
        shell: bash

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Windows 桌面构建无需 CGO（WebView2 走纯 Go syscall）；
      # 与 `wails build` 一致，这里不设 CGO_ENABLED，继承默认值。
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          bin="vellum-$VERSION-desktop-windows-amd64"
          go build -trimpath -tags "desktop,production" -ldflags "-s -w -H=windowsgui -X github.com/nonex-code/vellum/internal/version.Version=$VERSION" -o "dist/$bin.exe" .
          powershell -Command "Compress-Archive -Path 'dist/$bin.exe' -DestinationPath '$bin.zip'"
          sha256sum "$bin.zip" > checksums-desktop-windows-amd64.txt
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-amd64
          path: |
            vellum-${{ env.VERSION }}-desktop-windows-amd64.zip
            checksums-desktop-windows-amd64.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [server, desktop]
    # 任一构建 job 失败则不发布（needs 的默认语义）；仅 v* 标签发版。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        run: |
          cd artifacts
          cat checksums-*.txt > checksums.txt
          rm checksums-*.txt
          ls -1

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
